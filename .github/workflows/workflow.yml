name: Deploy to Amazon ECS

on:
  push:
    branches: [ "SpringBootRefactoring" ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build with Gradle
        run: |
          cd springboot
          chmod +x gradlew
          ./gradlew build -x test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        run: |
          REGISTRY="055447613012.dkr.ecr.ap-northeast-2.amazonaws.com"
          REPOSITORY="dockin-hackathon"
          IMAGE_TAG="${{ github.sha }}"
          
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG ./springboot
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          
          echo "image=$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Render Amazon ECS task definition
        id: render-container
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: springboot/task-definition.json
          # JSON 파일에 적힌 "spring-boot-container"와 정확히 일치시켰습니다.
          container-name: spring-boot-container
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-container.outputs.task-definition }}
          service: dockin-task-service-jt3rhkc1
          cluster: dockin-cluster
          wait-for-service-stability: true