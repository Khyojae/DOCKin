name: Deploy to Amazon ECS

on:
  push:
    branches: [ "SpringBootRefactoring" ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build with Gradle
        run: |
          cd springboot
          chmod +x gradlew
          ./gradlew build -x test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 5. Amazon ECR 로그인 (들여쓰기 교정됨)
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: "055447613012"

      # 6. Docker 이미지 빌드 및 ECR 푸시 (들여쓰기 교정됨)
      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        run: |
          REGISTRY="055447613012.dkr.ecr.ap-northeast-2.amazonaws.com"
          REPOSITORY="dockin-hackathon"
          IMAGE_TAG="${{ github.sha }}"
          
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG ./springboot
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          
          echo "image=$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # 7. ECS 배포 (경로: springboot/task-definition.json 확인됨)
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: springboot/task-definition.json
          service: dockin-service
          cluster: dockin-cluster
          image: ${{ steps.build-image.outputs.image }}