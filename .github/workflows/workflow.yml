name: Deploy to Amazon ECS

on:
  push:
    branches: [ "SpringBootRefactoring" ] # SpringBootRefactoring 브랜치에 코드가 푸시될 때마다 실행

permissions:
  id-token: write # AWS OIDC 인증을 위해 필수
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # 2. JDK 설정 (스프링부트 버전에 맞게 수정 가능)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle # Gradle 빌드 속도를 높이기 위해 캐싱 사용

      # 3. Gradle 빌드
      - name: Build with Gradle
        run: ./gradlew build -x test
        working-directory: ./DOCKin  # 이 줄을 추가하세요!

      # 4. AWS 자격 증명 설정 (우리가 만든 IAM Role 사용)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 5. Amazon ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 6. Docker 이미지 빌드 및 ECR 푸시
      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }} # 커밋 해시를 이미지 태그로 사용
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          # ./springboot[DOCKin] 폴더 안으로 들어가서 Dockerfile을 실행하도록 경로 지정
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./springboot[DOCKin]

      # 7. ECS 서비스 업데이트 (배포 실행)
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: task-definition.json # 프로젝트 내 ECS 설정 파일 이름
          service: dockin-service # AWS ECS 서비스 이름으로 수정 필요
          cluster: dockin-cluster # AWS ECS 클러스터 이름으로 수정 필요
          image: ${{ steps.build-image.outputs.image }}