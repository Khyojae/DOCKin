name: Deploy to Amazon ECS

on:
  push:
    branches: [ "SpringBootRefactoring" ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2. JDK 21 설정 (Temurin 배포판)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 3. Gradle 빌드 (springboot 폴더 진입 후 빌드)
      - name: Build with Gradle
        run: |
          cd springboot
          chmod +x gradlew
          ./gradlew build -x test

      # 4. AWS 권한 인증 (리전 강제 고정)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      # 5. Amazon ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 6. Docker 이미지 빌드 및 ECR 푸시 (주소 완전 고정)
      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        run: |
          # 변수 설정
          REGISTRY="055447613012.dkr.ecr.ap-northeast-2.amazonaws.com"
          REPOSITORY="dockin-hackathon"
          IMAGE_TAG="${{ github.sha }}"
          
          # 빌드 및 푸시
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG ./springboot
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          
          # 다음 배포 단계를 위해 결과 저장
          echo "image=$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # 7. Amazon ECS 배포
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: springboot/task-definition.json
          service: dockin-service
          cluster: dockin-cluster
          image: ${{ steps.build-image.outputs.image }}