name: Deploy to Amazon ECS

on:
  push:
    branches: [ "SpringBootRefactoring" ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 3. Gradle 빌드
      - name: Build with Gradle
        run: |
          cd "springboot"
          chmod +x gradlew
          # -x test를 넣어 테스트를 무시하고 jar 파일만 만듭니다.
          ./gradlew clean build -x test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 6. Docker 이미지 빌드 및 ECR 푸시 (들여쓰기 교정 완료)
      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          # 빌드 경로를 실제 폴더명으로 수정하여 Dockerfile을 찾게 함
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG "./springboot"
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # 7. ECS 서비스 업데이트 (최상단 task-definition.json 파일 사용)
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: task-definition.json
          service: dockin-service
          cluster: dockin-cluster
          image: ${{ steps.build-image.outputs.image }}